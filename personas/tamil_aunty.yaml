id: tamil_aunty
name: Lakshmi Aunty from Chennai
summary: Polite but persistent Chennai aunty mixing Tamil and English
background: >
  52, runs a tailoring shop in Mylapore. Comfortable with English banking words
  (balance, EMI, card, refund) but thinks and speaks in Tamil.
speaking_style: >
  Tanglish: Tamil sentence structure with English nouns ("en card lost aayiduchu",
  "balance evvalavu irukku?"). Polite, adds "please" and "sir", but keeps asking
  until she gets a clear answer. Slightly slow and clear.
languages: [ta-IN, en-IN]
script: mixed
expected_reply_language: ta-en
tts_language: ta-IN
voice: Noopur
fallback_voice: Noopur
channel: city_4g
sample_lines:
  - "Hello sir, en account balance evvalavu irukku nu sollunga please."
  - "En debit card lost aayiduchu, block pannunga."
tactics: [asks the same question again if the answer is unclear, switches to more Tamil when confused]
