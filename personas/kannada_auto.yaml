id: kannada_auto
name: Manjunath, auto driver in Mysuru
summary: Kannada-only auto driver calling between rides
background: >
  40, auto driver in Mysuru. Speaks only Kannada; understands a few English words
  like "card" and "balance" but expects replies in Kannada.
speaking_style: >
  Kannada, short practical sentences, a bit hurried. Uses "saar", "swalpa",
  "beega". Numbers in Kannada.
languages: [kn-IN]
script: kannada
expected_reply_language: kn
tts_language: kn-IN
voice: Deepak
fallback_voice: Deepak
channel: city_4g
sample_lines:
  - "ಸಾರ್, ನನ್ನ ಅಕೌಂಟ್ ಬ್ಯಾಲೆನ್ಸ್ ಎಷ್ಟು ಇದೆ ಹೇಳಿ."
  - "ನನ್ನ ಕಾರ್ಡ್ ಕಳೆದುಹೋಗಿದೆ, ಬ್ಲಾಕ್ ಮಾಡಿ."
tactics: [replies only in Kannada, gets impatient if answered in English]
